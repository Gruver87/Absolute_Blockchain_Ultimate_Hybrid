apiVersion: v1
kind: Secret
metadata:
  name: abs-node-secrets
  namespace: absolute-chain
type: Opaque
stringData:
  # ADR 0015 — EnvK8sSecretAdapter logical maps
  JWT_SECRET: "your_jwt_secret_here"
  RPC_API_KEYS: "your_generated_rpc_key_here"
  BRIDGE_ORACLE_SECRET: "your_bridge_oracle_secret_here"
  ETH_RPC_URL: "your_ethereum_rpc_url_here"
  # Node / BFT signing material (hex). Prefer SecretManager over wallet.json private_key in prod.
  WALLET_PRIVATE_KEY: "your_wallet_private_key_hex_here"
  BFT_SIGNING_KEY: "your_bft_signing_key_hex_here"
  # Optional Vault (when SECRET_BACKEND=vault on the pod)
  # VAULT_ADDR: "https://vault.example:8200"
  # VAULT_TOKEN: "your_vault_token_here"
  # VAULT_KV_PATH: "secret/data/abs/node"
