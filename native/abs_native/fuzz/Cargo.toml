[package]
name = "abs_native-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
abs_native = { path = "..", default-features = false }

[[bin]]
name = "p2p_frame"
