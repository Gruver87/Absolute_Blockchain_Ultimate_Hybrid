doc = false
bench = false

[[bin]]
name = "p2p_wire"
path = "fuzz_targets/p2p_wire.rs"
test = false
doc = false
bench = false

[[bin]]
name = "p2p_rate_limit"
path = "fuzz_targets/p2p_rate_limit.rs"
test = false
doc = false
bench = false
