  <text x="100" y="128" fill="#f8fafc" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700">Absolute Blockchain</text>
  <text x="100" y="186" fill="#94a3b8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="28" font-weight="500">Ultimate Hybrid ù Python + Rust L1</text>
  <text x="100" y="260" fill="#cbd5e1" font-family="Consolas, Menlo, monospace" font-size="20">prod mesh ù RocksDB ù REST/JSON-RPC ù EVM ù abs_native</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e2e8f0">
    <rect x="100" y="320" width="210" height="48" rx="10" fill="#134e4a" stroke="#2dd4bf" stroke-width="1.5"/>
