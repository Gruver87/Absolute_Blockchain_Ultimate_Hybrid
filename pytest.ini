[pytest]
testpaths = tests
python_files = test_*.py
norecursedirs = legacy smoke .git __pycache__ .venv venv .hypothesis .pytest_cache
asyncio_mode = auto
filterwarnings =
    ignore::pytest.PytestReturnNotNoneWarning
markers =
    chaos: Chaos Injection Framework (ADR 0012)
    chaos_smoke: short chaos subset safe for default CI
    chaos_full: full ≥500 / ≤120s bombardment (set CHAOS_FULL=1)
    e2e: end-to-end live process tests
    live_mesh: 4-node live P2P mesh + physical kill-9 (set LIVE_MESH_E2E=1)
